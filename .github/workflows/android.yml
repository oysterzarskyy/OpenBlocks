name: Android beta build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK (arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973"

      - name: Configure Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust game library
        run: cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build --release --lib

      - name: Copy game assets into APK
        run: |
          mkdir -p android/app/src/main/assets
          cp -R assets/. android/app/src/main/assets/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Package debug APK
        run: gradle -p android assembleDebug

      - name: Upload installable beta APK
        uses: actions/upload-artifact@v4
        with:
          name: openblocks-android-arm64-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
