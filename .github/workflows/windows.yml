name: Windows desktop build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64 release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Windows executable with Docker
        run: docker build --target windows-artifact --tag openblocks-windows .

      - name: Extract Windows executable
        run: |
          docker create --name openblocks-windows-artifact openblocks-windows
          docker cp openblocks-windows-artifact:/openblocks.exe ./openblocks.exe
          docker cp openblocks-windows-artifact:/assets ./assets
          docker rm openblocks-windows-artifact

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: openblocks-windows-x64
          path: |
            openblocks.exe
            assets/**
          if-no-files-found: error
